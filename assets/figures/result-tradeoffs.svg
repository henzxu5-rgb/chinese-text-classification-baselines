<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">验证集上的预训练模型和类别加权结果概览</title>
  <desc id="desc">左侧比较 TextCNN 和轻量预训练 Transformer 的 Accuracy、Macro-F1、MAE 以及二星、三星 F1。右侧比较普通与类别加权 TextCNN 的二星、三星 Recall、Macro-F1 和 Accuracy。</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .heading { fill: #1f2328; font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .subheading { fill: #57606a; font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #1f2328; font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .note { fill: #57606a; font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .value { fill: #1f2328; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .bar-base { fill: #0969da; }
    .bar-compare { fill: #1a7f37; }
    .track { fill: #d8dee4; }
    .rule { stroke: #d0d7de; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .heading, .label, .value { fill: #f0f6fc; }
      .subheading, .note { fill: #8b949e; }
      .track { fill: #30363d; }
      .rule { stroke: #30363d; }
      .bar-base { fill: #58a6ff; }
      .bar-compare { fill: #3fb950; }
    }
  </style>
  <rect class="bg" width="1120" height="560" rx="12"/>
  <text class="heading" x="48" y="52">验证集结果概览</text>
  <text class="subheading" x="48" y="80">所有数值来自已保存的实验输出；两项比较的实验协议不同，分别呈现。</text>

  <rect class="panel" x="40" y="112" width="504" height="400" rx="10"/>
  <text class="label" x="72" y="152">轻量预训练 Transformer</text>
  <text class="note" x="72" y="177">TextCNN 对照；随机种子 42；128-token 开头加结尾输入</text>
  <circle class="bar-base" cx="80" cy="211" r="6"/><text class="note" x="94" y="216">TextCNN</text>
  <circle class="bar-compare" cx="188" cy="211" r="6"/><text class="note" x="202" y="216">预训练 Transformer</text>

  <text class="label" x="72" y="256">Accuracy</text>
  <rect class="track" x="220" y="239" width="220" height="12" rx="6"/>
  <rect class="bar-base" x="220" y="239" width="122" height="12" rx="6"/>
  <text class="value" x="450" y="251">55.5</text>
  <rect class="track" x="220" y="263" width="220" height="12" rx="6"/>
  <rect class="bar-compare" x="220" y="263" width="124" height="12" rx="6"/>
  <text class="value" x="450" y="275">56.2</text>

  <text class="label" x="72" y="320">Macro-F1</text>
  <rect class="track" x="220" y="303" width="220" height="12" rx="6"/>
  <rect class="bar-base" x="220" y="303" width="96" height="12" rx="6"/>
  <text class="value" x="450" y="315">43.4</text>
  <rect class="track" x="220" y="327" width="220" height="12" rx="6"/>
  <rect class="bar-compare" x="220" y="327" width="106" height="12" rx="6"/>
  <text class="value" x="450" y="339">48.3</text>

  <line class="rule" x1="72" y1="367" x2="512" y2="367"/>
  <text class="label" x="72" y="404">二星 F1</text><text class="value" x="250" y="404">10.3 → 21.1</text>
  <text class="label" x="72" y="436">三星 F1</text><text class="value" x="250" y="436">26.0 → 36.7</text>
  <text class="label" x="72" y="468">MAE</text><text class="value" x="250" y="468">0.507 → 0.490</text>
  <text class="note" x="72" y="494">训练时间：249.7 秒 → 3076.9 秒（约 12 倍）</text>

  <rect class="panel" x="576" y="112" width="504" height="400" rx="10"/>
  <text class="label" x="608" y="152">类别加权 TextCNN</text>
  <text class="note" x="608" y="177">三随机种子均值；仅改变交叉熵中的类别权重</text>
  <circle class="bar-base" cx="616" cy="211" r="6"/><text class="note" x="630" y="216">普通交叉熵</text>
  <circle class="bar-compare" cx="746" cy="211" r="6"/><text class="note" x="760" y="216">类别加权</text>

  <text class="label" x="608" y="256">二星 Recall</text>
  <rect class="track" x="770" y="239" width="220" height="12" rx="6"/>
  <rect class="bar-base" x="770" y="239" width="8" height="12" rx="6"/>
  <text class="value" x="1000" y="251">3.8</text>
  <rect class="track" x="770" y="263" width="220" height="12" rx="6"/>
  <rect class="bar-compare" x="770" y="263" width="83" height="12" rx="6"/>
  <text class="value" x="1000" y="275">38.0</text>

  <text class="label" x="608" y="320">三星 Recall</text>
  <rect class="track" x="770" y="303" width="220" height="12" rx="6"/>
  <rect class="bar-base" x="770" y="303" width="61" height="12" rx="6"/>
  <text class="value" x="1000" y="315">27.7</text>
  <rect class="track" x="770" y="327" width="220" height="12" rx="6"/>
  <rect class="bar-compare" x="770" y="327" width="85" height="12" rx="6"/>
  <text class="value" x="1000" y="339">38.6</text>

  <line class="rule" x1="608" y1="367" x2="1048" y2="367"/>
  <text class="label" x="608" y="404">Macro-F1</text><text class="value" x="790" y="404">43.2 → 46.4</text>
  <text class="label" x="608" y="436">Accuracy</text><text class="value" x="790" y="436">55.5 → 51.8</text>
  <text class="label" x="608" y="468">MAE</text><text class="value" x="790" y="468">0.510 → 0.588</text>
  <text class="note" x="608" y="494">少数类召回与平均 F1 提高；整体误差扩大</text>
</svg>
